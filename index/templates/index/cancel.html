<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagesa u anulua · Football Live</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1220; --border: #23304d;
      --text: #e7ecf5; --muted: #94a3b8;
      --primary: #22c55e; --primary-dark: #16a34a;
      --danger: #ef4444; --ghost: rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -20%, #1c2a49 0%, var(--bg) 60%);
      color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .wrap { max-width: 560px; width: 100%; }
    .hero {
      text-align: center; padding: 56px 32px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(239,68,68,0.08), transparent);
      border: 1px solid var(--border);
    }
    .icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(239,68,68,0.15); color: var(--danger);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 2.2rem; margin-bottom: 24px;
    }
    h1 { font-size: 1.7rem; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 12px;
      font-weight: 600; font-size: 0.95rem;
      text-decoration: none; border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: #052e16;
      box-shadow: 0 8px 24px -8px rgba(34,197,94,0.6);
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-ghost {
      background: var(--ghost); color: var(--text);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="icon"><i class="fas fa-xmark"></i></div>
      <h1>Pagesa u anulua</h1>
      <p>Nuk u bë asnjë pagesë. Mund të provosh sërish kur të duash.</p>
      <div class="actions">
        <a href="{% url 'pricing' %}" class="btn btn-primary">
          <i class="fas fa-rotate-right"></i> Provo sërish
        </a>
        <a href="/" class="btn btn-ghost">
          <i class="fas fa-arrow-left"></i> Kthehu
        </a>
      </div>
    </div>
  </div>
</body>
</html>
