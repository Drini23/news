<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1220;
      color: #e7ecf5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-wrap { width: 100%; max-width: 1000px; }

    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(34, 197, 94, 0.2);
      position: relative;
    }
    .player-box iframe,
    .player-box video {
      width: 100%; height: 100%; border: 0; display: block;
    }

    .stream-error {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 30px;
      text-align: center;
    }
    .stream-error i {
      font-size: 48px;
      color: #f59e0b;
    }
    .stream-error h3 {
      color: #f8fafc;
      font-size: 1.2rem;
      margin: 0;
    }
    .stream-error p {
      color: #94a3b8;
      font-size: 0.9rem;
      max-width: 420px;
      margin: 0;
      line-height: 1.6;
    }
    .stream-error .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .stream-error a,
    .stream-error button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: inherit;
    }
    .btn-retry {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }
    .btn-retry:hover { transform: translateY(-2px); }
    .btn-open {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e7ecf5;
    }
    .btn-open:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: #22c55e;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e7ecf5;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: #22c55e;
    }
  </style>
</head>
<body>

<div class="player-wrap">
  <div class="player-box" id="playerBox">
    {% if not stream_url %}
      <!-- Server already knows there is no stream — render error immediately -->
      <div class="stream-error">
        <i class="fas fa-satellite-dish"></i>
        <h3>Transmetimi nuk është i disponueshëm</h3>
        <p>{{ error|default:"Ky transmetim nuk është i disponueshëm për momentin. Provo një ndeshje tjetër ose kthehu më vonë." }}</p>
        <div class="actions">
          <a class="btn-retry" href="javascript:location.reload()">
            <i class="fas fa-sync-alt"></i> Provo Përsëri
          </a>
          <a class="btn-open" href="{% url 'new_api' %}">
            <i class="fas fa-list"></i> Ndeshje të tjera
          </a>
        </div>
      </div>
    {% endif %}
  </div>

  <div style="text-align:center;">
    <a href="{% url 'new_api' %}" class="back-btn">
      <i class="fas fa-arrow-left"></i> Kthehu te ndeshjet
    </a>
  </div>
</div>

{% if stream_url %}
<script>
(function () {
  const wrapperUrl = "{{ stream_url|escapejs }}";
  const playerBox = document.getElementById('playerBox');

  let hlsUrl = null;
  try {
    hlsUrl = new URL(wrapperUrl).searchParams.get("url");
  } catch (e) { /* ignore */ }

  let errorTimeout;

  function showError(reason) {
    clearTimeout(errorTimeout);
    playerBox.innerHTML = `
      <div class="stream-error">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Transmetimi nuk mund të ngarkohet</h3>
        <p>${reason || 'Ky transmetim mund të jetë i bllokuar në zonën tuaj ose nuk është i disponueshëm për momentin.'}</p>
        <div class="actions">
          <a class="btn-retry" href="javascript:location.reload()">
            <i class="fas fa-sync-alt"></i> Provo Përsëri
          </a>
          <a class="btn-open" href="${wrapperUrl}" target="_blank" rel="noopener">
            <i class="fas fa-external-link-alt"></i> Hap në dritare të re
          </a>
        </div>
      </div>`;
  }

  function tryNativePlayer(url) {
    if (!window.Hls || !Hls.isSupported()) return false;

    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    playerBox.innerHTML = '';
    playerBox.appendChild(video);

    const hls = new Hls({
      lowLatencyMode: true,
      enableWorker: true,
      maxBufferLength: 30,
      manifestLoadingTimeOut: 8000,
      manifestLoadingMaxRetry: 2,
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      clearTimeout(errorTimeout);
      console.log("HLS manifest loaded OK");
    });

    hls.on(Hls.Events.ERROR, (evt, data) => {
      console.warn("HLS error:", data.type, data.details);
      if (data.fatal) {
        hls.destroy();
        showError('Ky transmetim nuk është i disponueshëm.');
      }
    });

    errorTimeout = setTimeout(() => {
      console.warn("HLS load timeout");
      try { hls.destroy(); } catch (e) {}
      showError('Koha e ngarkimit skadoi. Transmetimi mund të jetë i bllokuar.');
    }, 10000);

    return true;
  }

  function tryIframe(url) {
    playerBox.innerHTML = `
      <iframe
        src="${url}"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="no-referrer">
      </iframe>`;
  }

  if (hlsUrl && hlsUrl.includes('.m3u8')) {
    const used = tryNativePlayer(hlsUrl);
    if (!used) tryIframe(wrapperUrl);
  } else {
    tryIframe(wrapperUrl);
  }
})();
</script>
{% endif %}

</body>
</html>
