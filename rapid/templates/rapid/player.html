<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        body{
            font-family:'Poppins', sans-serif;
            background:#0f172a;
            color:white;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .player-wrap{
            width:100%;
            max-width:1000px;
            background:#000;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 10px 40px rgba(0,0,0,0.6);
        }

        iframe{
            width:100%;
            aspect-ratio:16/9;
            display:block;
            background:#000;
            border:none;
        }

        .back-btn{
            margin-top:20px;
            display:inline-block;
            padding:12px 24px;
            background:linear-gradient(135deg,#38bdf8,#22c55e);
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:600;
            transition:0.3s;
        }

        .back-btn:hover{
            transform:scale(1.05);
            opacity:0.9;
        }

        .error{
            background:#1e293b;
            padding:40px;
            border-radius:16px;
            text-align:center;
            max-width:600px;
        }
    </style>
</head>
<body>

    {% if stream_url %}

        <div class="player-wrap">
            <iframe
                src="{{ stream_url }}"
                allowfullscreen
                allow="autoplay; encrypted-media; fullscreen"
                referrerpolicy="no-referrer"
            ></iframe>
        </div>

    {% else %}

        <div class="error">
            <h2>Stream nuk është i disponueshëm</h2>
            <p>Linku i videos nuk mund të ngarkohet.</p>
        </div>

    {% endif %}

    <a href="/rapid/new_api/" class="back-btn">
        ← Kthehu te ndeshjet
    </a>

</body>
</html>
